name: Desktop prototype
on:
  workflow_dispatch:
  push:
    branches: [feature/desktop-ntfy]
    paths: ['desktop/**', 'desktop.py', 'bridge/**', 'web/**', 'run.py', 'scripts/**', 'package*.json', 'requirements-desktop.txt', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - run: python -B -m unittest discover -s tests -v
      - run: npm run test:desktop
      - run: python scripts/build-desktop.py
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/desktop/*.zip
            dist/desktop/*.exe
