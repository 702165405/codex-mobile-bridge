name: Desktop builds
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, feature/desktop-ntfy, codex/windows-desktop-app, integration/desktop-cross-platform]
    paths: ['desktop/**', 'desktop.py', 'bridge/**', 'web/**', 'run.py', 'scripts/**', 'tests/**', 'package*.json', 'requirements-desktop.txt', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            app-dir: mac-arm64
          - os: macos-15-intel
            arch: x64
            app-dir: mac
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - run: python -B -m unittest discover -s tests -v
      - run: npm run test:desktop
      - run: npm run test:updater
      - run: python scripts/build-desktop.py
      - if: runner.os == 'macOS'
        run: npm run build:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the distributed macOS DMG and ZIP
        if: runner.os == 'macOS'
        run: |
          python scripts/verify-macos.py dist/desktop/*-macOS-${{ matrix.arch }}.dmg --arch ${{ matrix.arch }}
          python scripts/verify-macos.py dist/desktop/*-macOS-${{ matrix.arch }}.zip --arch ${{ matrix.arch }}
      - name: Launch the signed macOS App
        if: runner.os == 'macOS'
        run: node scripts/smoke-macos.cjs "dist/desktop/${{ matrix.app-dir }}/Codex Mobile Bridge.app"
      - if: runner.os == 'Windows'
        run: npm run build:windows
      - if: runner.os == 'Windows'
        run: npm run test:windows-app
      - name: Verify packaged Bark and ntfy notifications
        run: node scripts/smoke-notifications.cjs
      - name: Verify packaged login and device access
        run: node scripts/smoke-auth.cjs
      - name: Verify packaged Windows HTTPS trust
        if: runner.os == 'Windows'
        run: python scripts/verify-https.py "dist/desktop/win-unpacked/resources/gateway/codex-mobile-gateway.exe"
      - if: runner.os == 'macOS'
        run: npm run test:pairing
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway
      - if: runner.os == 'Windows'
        run: npm run test:pairing
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway.exe
      - name: Exercise packaged update and recovery
        shell: bash
        run: node scripts/smoke-update.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
