<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f2"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><link rel="stylesheet" href="/style.css"><title data-i18n="Codex · 手机连接">Codex · 手机连接</title></head>
<body>
<label class="phone-language">Language / 语言<select id="phone-language" data-language aria-label="Language / 语言"><option value="zh">简体中文</option><option value="en">English</option></select></label>
<section id="login" class="login" hidden>
  <div class="wordmark"><span class="mark">⌘</span> CODEX <span class="light">/ MOBILE</span></div>
  <div class="login-card"><div class="eyebrow"><span data-i18n="继续电脑上的工作">继续电脑上的工作</span></div><h1><span data-i18n="连接你的 Codex">连接你的 Codex</span></h1><p class="muted"><span data-i18n="聊天、查看进度，以及处理待确认的操作。">聊天、查看进度，以及处理待确认的操作。</span></p>
  <form id="login-form"><div id="credentials"><label><span data-i18n="账号">账号</span><input id="username" name="username" autocomplete="username" required value="admin"></label><label><span data-i18n="密码">密码</span><input id="password" name="password" type="password" autocomplete="current-password" required></label></div><p id="noauth" class="muted" hidden><span data-i18n="此网关已启用免密访问。">此网关已启用免密访问。</span></p><button type="submit" class="primary" id="login-button"><span data-i18n="连接电脑">连接电脑</span> <span>↗</span></button><p id="login-error" role="alert" class="error"></p></form></div><div class="login-foot"><span data-i18n="任务在电脑运行 · 沿用桌面模型设置">任务在电脑运行 · 沿用桌面模型设置</span></div>
</section>
<div id="app" class="app" hidden>
  <aside id="sidebar"><header class="sidebar-head"><div class="wordmark"><span class="mark">⌘</span> CODEX <span class="light">/ MOBILE</span></div><button id="refresh" class="icon-button" aria-label="刷新聊天列表" data-i18n-aria-label="刷新聊天列表">↻</button></header><div class="list-heading"><h2><span data-i18n="聊天">聊天</span></h2><button id="new-chat" class="plain" type="button"><span data-i18n="＋ 新建">＋ 新建</span></button><label class="archive"><input id="archived" type="checkbox"> <span data-i18n="已归档">已归档</span></label></div><input id="search" class="search" placeholder="搜索聊天或项目" aria-label="搜索聊天或项目" data-i18n-placeholder="搜索聊天或项目" data-i18n-aria-label="搜索聊天或项目"><label class="list-mode"><span data-i18n="显示方式">显示方式</span><select id="list-mode" aria-label="聊天列表显示方式" data-i18n-aria-label="聊天列表显示方式"><option value="recent" data-i18n="最近交互">最近交互</option><option value="project" data-i18n="按项目">按项目</option></select></label><p id="host-errors" class="error host-errors" hidden></p><div id="sessions" class="sessions"></div><button id="more" class="plain" hidden><span data-i18n="加载更多">加载更多</span></button><footer class="sidebar-foot"><span><span data-i18n="本机与 SSH 会话">本机与 SSH 会话</span></span><button id="logout" class="plain"><span data-i18n="退出登录">退出登录</span></button></footer></aside>
  <main id="main"><div id="welcome" class="welcome"><div class="mark large">⌘</div><h1><span data-i18n="从一条聊天继续">从一条聊天继续</span></h1><p class="muted"><span data-i18n="选择电脑上的聊天，查看进度或发送消息。">选择电脑上的聊天，查看进度或发送消息。</span></p></div>
  <section id="chat" class="chat" hidden><header class="chat-head"><button id="back" class="icon-button" aria-label="返回聊天列表" data-i18n-aria-label="返回聊天列表">‹</button><div class="chat-info"><h1 id="chat-title"></h1><div id="chat-meta" class="muted"></div></div><span id="status" class="status"></span></header>
  <div id="notice" class="notice" hidden><span id="notice-text"></span><button id="reconnect" class="plain"><span data-i18n="重新连接">重新连接</span></button></div>
  <div id="timeline" class="timeline"><button id="history" class="plain history" hidden><span data-i18n="加载完整历史">加载完整历史</span></button><button id="older" class="plain history" hidden><span data-i18n="查看更早内容">查看更早内容</span></button><div id="messages"></div><div id="approvals"></div><div id="queued"></div><div id="working" class="working" hidden><i></i> <span data-i18n="Codex 正在工作…">Codex 正在工作…</span></div></div>
  <button id="newer" class="newer" hidden><span data-i18n="有新内容 ↓">有新内容 ↓</span></button><form id="composer" class="composer"><div class="composer-tools"><button id="model-button" class="tool-button" type="button"><span data-i18n="模型">模型</span></button><button id="notify-button" class="tool-button" type="button" title="待确认请求通知" data-i18n-title="待确认请求通知"><span data-i18n="提醒">提醒</span></button><button id="skills-button" class="tool-button" type="button">Skill <span id="skill-count"></span></button></div><div id="skill-pills" class="skill-pills"></div><div id="send-error" class="error" role="alert"></div><textarea id="message" rows="3" placeholder="继续这条聊天…" aria-label="消息内容" maxlength="100000" data-i18n-placeholder="继续这条聊天…" data-i18n-aria-label="消息内容"></textarea><div class="compose-bottom"><select id="send-mode" aria-label="发送方式" data-i18n-aria-label="发送方式"><option value="send" data-i18n="发送新消息">发送新消息</option><option value="queue" data-i18n="完成后发送">完成后发送</option><option value="steer" data-i18n="补充当前任务">补充当前任务</option></select><div class="compose-actions"><button id="stop" class="stop" type="button" hidden><span data-i18n="■ 停止">■ 停止</span></button><button id="send" type="submit" class="primary"><span data-i18n="发送 ↑">发送 ↑</span></button></div></div><div class="compose-foot"><span id="execution-host"><span data-i18n="在本机运行">在本机运行</span></span> <span id="provider"></span></div></form></section></main>
</div><div id="toast" class="toast" role="status" hidden></div><dialog id="model-dialog" class="picker"><div class="picker-head"><h2><span data-i18n="模型与推理强度">模型与推理强度</span></h2><button class="icon-button" data-close="model-dialog" aria-label="关闭模型设置" data-i18n-aria-label="关闭模型设置">×</button></div><p class="muted"><span data-i18n="应用到当前聊天，正在运行的任务从下一轮使用。">应用到当前聊天，正在运行的任务从下一轮使用。</span></p><form id="model-form"><label><span data-i18n="模型">模型</span><select id="model-select" required></select></label><label id="custom-model-label" hidden><span data-i18n="自定义模型 ID">自定义模型 ID</span><input id="custom-model" placeholder="输入当前 API 服务支持的模型 ID" maxlength="200" data-i18n-placeholder="输入当前 API 服务支持的模型 ID"></label><label><span data-i18n="推理强度">推理强度</span><select id="effort-select" required></select></label><p id="model-description" class="muted"></p><p id="model-error" class="error" role="alert"></p><button id="model-save" class="primary" type="submit"><span data-i18n="应用到此聊天">应用到此聊天</span></button></form></dialog>
<dialog id="new-chat-dialog" class="picker" aria-labelledby="new-chat-heading"><div class="picker-head"><h2 id="new-chat-heading"><span data-i18n="新建聊天">新建聊天</span></h2><button class="icon-button" data-close="new-chat-dialog" aria-label="关闭新建聊天" data-i18n-aria-label="关闭新建聊天">×</button></div><p class="muted"><span data-i18n="在电脑 App 的已有项目中创建空聊天，之后可在手机发送消息。电脑会打开这条聊天。">在电脑 App 的已有项目中创建空聊天，之后可在手机发送消息。电脑会打开这条聊天。</span></p><form id="new-chat-form"><label><span data-i18n="项目与运行主机">项目与运行主机</span><select id="new-chat-project" required></select></label><p id="new-chat-path" class="muted"></p><label><span data-i18n="聊天名称">聊天名称</span><input id="new-chat-title" value="新聊天" maxlength="120" required></label><p id="new-chat-error" class="error" role="alert"></p><button id="new-chat-submit" class="primary" type="submit"><span data-i18n="创建并打开">创建并打开</span></button></form></dialog>
<dialog id="skills-dialog" class="picker"><div class="picker-head"><h2><span data-i18n="选择 Skill">选择 Skill</span></h2><button class="icon-button" data-close="skills-dialog" aria-label="关闭 Skill 选择" data-i18n-aria-label="关闭 Skill 选择">×</button></div><p class="muted"><span data-i18n="选择后随下一条消息一起发送，最多 8 个。">选择后随下一条消息一起发送，最多 8 个。</span></p><input id="skill-search" placeholder="搜索已安装 Skill" aria-label="搜索已安装 Skill" data-i18n-placeholder="搜索已安装 Skill" data-i18n-aria-label="搜索已安装 Skill"><div id="skill-list" class="skill-list"></div><p id="skills-error" class="error" role="alert"></p><div class="picker-actions"><button id="skills-refresh" class="plain" type="button"><span data-i18n="刷新列表">刷新列表</span></button><button class="primary" data-close="skills-dialog" type="button"><span data-i18n="完成">完成</span></button></div></dialog><script src="/vendor/markdown-it.min.js" defer></script><script src="/vendor/katex/katex.min.js" defer></script><script src="/vendor/texmath.js" defer></script><script src="/markdown.js" defer></script><script src="/i18n.js" defer></script><script src="/timeline.js" defer></script><script src="/app.js" defer></script></body></html>
